<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech & Mobile Review v2.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;background:#F1F5F9;color:#1E293B;line-height:1.5}header{background:#0F172A;color:#fff;padding:25px;text-align:center}.container{max-width:1100px;margin:20px auto;padding:0 15px}.controls{background:#fff;padding:15px;border-radius:10px;margin-bottom:20px}.search-input{width:100%;padding:12px;border:2px solid #CBD5E1;border-radius:8px;font-size:16px}.brand-filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;justify-content:center}.filter-btn{background:#E2E8F0;border:none;padding:7px 14px;border-radius:15px;font-weight:bold;cursor:pointer}.filter-btn.active,.filter-btn:hover{background:#2563EB;color:#fff}.phones-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.phone-card{background:#fff;border-radius:10px;padding:18px;border:1px solid #E2E8F0;display:flex;flex-direction:column;justify-content:space-between}.brand-tag{background:#DBEAFE;color:#1D4ED8;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:bold;display:inline-block;margin-bottom:6px}.specs-list{list-style:none;background:#F8FAFC;padding:10px;border-radius:6px;margin:10px 0;font-size:13px;border-left:3px solid #2563EB}.price-badge{background:#10B981;color:#fff;padding:6px;border-radius:5px;font-weight:bold;text-align:center;margin-top:10px}footer{background:#0F172A;color:#94A3B8;text-align:center;padding:20px;margin-top:30px}
</style>
</head>
<body>
<header><h1>📱 Tech & Mobile Review</h1><p>Complete Smartphone Database & Honest Reviews</p></header>
<div class="container">
<div class="controls">
<input type="text" id="phoneSearch" class="search-input" placeholder="Search any phone or brand..." onkeyup="filterPhones()">
<div class="brand-filters">
<button class="filter-btn active" onclick="filterByBrand('All', this)">All</button>
<button class="filter-btn" onclick="filterByBrand('Samsung', this)">Samsung</button>
<button class="filter-btn" onclick="filterByBrand('Apple', this)">Apple</button>
<button class="filter-btn" onclick="filterByBrand('Xiaomi', this)">Xiaomi</button>
<button class="filter-btn" onclick="filterByBrand('Oppo', this)">Oppo</button>
<button class="filter-btn" onclick="filterByBrand('Vivo', this)">Vivo</button>
<button class="filter-btn" onclick="filterByBrand('Realme', this)">Realme</button>
<button class="filter-btn" onclick="filterByBrand('Infinix', this)">Infinix</button>
<button class="filter-btn" onclick="filterByBrand('Tecno', this)">Tecno</button>
</div>
</div>
<div class="phones-grid" id="phonesContainer"></div>
</div>
<footer><p>&copy; 2026 Tech & Mobile Review - Updated</p></footer>
<script>
const phonesData=[
{brand:"Samsung",name:"Galaxy S26 Ultra",display:"6.9 AMOLED 120Hz",processor:"Snapdragon 8 Elite",camera:"200MP Quad",battery:"5500mAh 65W",price:"$1,299",review:"Ultimate flagship with anti-reflective screen and S-Pen."},
{brand:"Samsung",name:"Galaxy A56 5G",display:"6.6 Super AMOLED",processor:"Exynos 1580",camera:"50MP OIS Triple",battery:"5000mAh 45W",price:"$449",review:"Premium glass build with 6 years of updates."},
{brand:"Apple",name:"iPhone 17 Pro Max",display:"6.9 LTPO OLED",processor:"Apple A19 Pro",camera:"48MP Triple 5x",battery:"4850mAh",price:"$1,199",review:"Best pro video recording and gaming in titanium body."},
{brand:"Apple",name:"iPhone 17",display:"6.1 OLED 120Hz",processor:"Apple A19",camera:"48MP Dual",battery:"3800mAh",price:"$799",review:"Brings smooth 120Hz ProMotion display to standard model."},
{brand:"Xiaomi",name:"Xiaomi 16 Ultra",display:"6.73 LTPO AMOLED",processor:"Snapdragon 8 Elite",camera:"50MP 1-inch Leica",battery:"6000mAh 90W",price:"$999",review:"Co-engineered with Leica for DSLR-like photography."},
{brand:"Xiaomi",name:"Redmi Note 15 Pro+",display:"6.67 Curved AMOLED",processor:"Snapdragon 7s Gen 4",camera:"200MP OIS",battery:"6200mAh 90W",price:"$379",review:"Curved screen mid-ranger with giant 6200mAh battery."},
{brand:"Oppo",name:"Oppo Find X8 Pro",display:"6.78 LTPO AMOLED",processor:"Dimensity 9400",camera:"50MP Hasselblad",battery:"5910mAh 80W",price:"$949",review:"Dual periscope zoom lenses and Hasselblad colors."},
{brand:"Oppo",name:"Oppo Reno 14 Pro",display:"6.83 Curved AMOLED",processor:"Dimensity 8450",camera:"50MP OIS Telephoto",battery:"5800mAh 80W",price:"$549",review:"Stylish portrait phone with IP69 water resistance."},
{brand:"Vivo",name:"Vivo X200 Pro",display:"6.78 ZEISS AMOLED",processor:"Dimensity 9400",camera:"200MP ZEISS APO",battery:"6000mAh 90W",price:"$929",review:"Unmatched telephoto macro and portrait photography."},
{brand:"Vivo",name:"Vivo V50 Pro",display:"6.78 Curved AMOLED",processor:"Dimensity 9300+",camera:"50MP ZEISS Aura",battery:"5500mAh 90W",price:"$499",review:"Ultra-slim design with studio Aura Light for portraits."},
{brand:"Realme",name:"Realme GT 7 Pro",display:"6.78 Eco2 OLED",processor:"Snapdragon 8 Elite",camera:"50MP Sony Periscope",battery:"6500mAh 120W",price:"$699",review:"Massive 6500mAh battery and blazing 120W charging."},
{brand:"Realme",name:"Realme 14 Pro+",display:"6.83 Curved OLED",processor:"Snapdragon 7s Gen 3",camera:"50MP OIS Periscope",battery:"6000mAh 80W",price:"$369",review:"True periscope zoom and color-changing back design."},
{brand:"Infinix",name:"Infinix Zero 40 5G",display:"6.78 Curved 144Hz",processor:"Dimensity 8200",camera:"108MP OIS + 50MP",battery:"5000mAh 45W",price:"$299",review:"144Hz display and wireless charging at a low price."},
{brand:"Infinix",name:"Infinix Note 50 Pro+",display:"6.78 Curved 144Hz",processor:"Dimensity 8350",camera:"50MP Periscope",battery:"5200mAh 100W",price:"$349",review:"Periscope zoom and 50W magnetic wireless charging."},
{brand:"Tecno",name:"Tecno Camon 40 Premier",display:"6.67 LTPO 144Hz",processor:"Dimensity 8350",camera:"50MP Sony Periscope",battery:"5100mAh 70W",price:"$399",review:"Flagship triple 50MP camera system with AI chip."},
{brand:"Tecno",name:"Tecno Pova 7 Pro",display:"6.78 AMOLED 120Hz",processor:"Dimensity 7300",camera:"108MP Main",battery:"6000mAh 70W",price:"$249",review:"Gaming design with giant 6000mAh battery."}
];
let currentBrand='All';
function renderPhones(list){
const c=document.getElementById('phonesContainer');
c.innerHTML=list.length===0?'<p style="text-align:center;grid-column:1/-1;">No phones found.</p>':'';
list.forEach(p=>{c.innerHTML+=`<div class="phone-card"><div><span class="brand-tag">${p.brand}</span><h3>${p.name}</h3><ul class="specs-list"><li><b>Display:</b> ${p.display}</li><li><b>Chip:</b> ${p.processor}</li><li><b>Camera:</b> ${p.camera}</li><li><b>Battery:</b> ${p.battery}</li></ul><p style="font-size:13.5px;color:#475569">${p.review}</p></div><div class="price-badge">${p.price}</div></div>`;});
}
function filterByBrand(b,btn){currentBrand=b;document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');filterPhones();}
function filterPhones(){const q=document.getElementById('phoneSearch').value.toLowerCase();renderPhones(phonesData.filter(p=>(currentBrand==='All'||p.brand===currentBrand)&&(p.name.toLowerCase().includes(q)||p.brand.toLowerCase().includes(q)||p.processor.toLowerCase().includes(q))));}
renderPhones(phonesData);
</script>
</body>
</html>
